name: Collect API history
on:
  push:
    branches: [main, codex/api-history]
    paths:
      - 'scripts/history-*.mjs'
      - 'scripts/collect-history.mjs'
      - 'scripts/collect.mjs'
      - 'public/model.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Reconcile all available months instead of the recent overlap
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: vaststats-api-history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test history aggregation and public-data boundary
        run: npm test
      - name: Rebuild summaries from Vast history
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          VAST_BOX_MAP: ${{ secrets.VAST_BOX_MAP }}
          HISTORY_REBUILD: ${{ inputs.rebuild && '1' || '0' }}
        run: node scripts/collect-history.mjs
      - name: Save sanitized month summaries
        run: |
          git config user.name 'VastStats collector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh API history summaries"
            git push
          fi
