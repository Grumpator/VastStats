name: Update and publish dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Explicit minutes avoid relying on range/step handling in the scheduler.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  contents: read

concurrency:
  group: vaststats
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test aggregation and public export
        run: npm test
      - name: Collect public summary
        continue-on-error: true
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          VAST_BOX_MAP: ${{ secrets.VAST_BOX_MAP }}
        run: node scripts/collect.mjs
      - name: Save summary history
        run: |
          git config user.name 'VastStats collector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public fleet summary"
            git push
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
