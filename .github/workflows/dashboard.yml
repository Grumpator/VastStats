name: Update and publish dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: vaststats
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test aggregation and public export
        run: npm test
      - name: Collect public summary
        continue-on-error: true
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          VAST_BOX_MAP: ${{ secrets.VAST_BOX_MAP }}
        run: node scripts/collect.mjs
      - name: Save summary history
        run: |
          git config user.name 'VastStats collector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public fleet summary"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
