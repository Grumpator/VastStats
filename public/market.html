<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Compare your fleet with current Vast marketplace supply and GPU pricing.">
  <title>VastStats · Market</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23245840'/%3E%3Cpath d='M8 10l8 14 8-14' fill='none' stroke='%23d4ef8f' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="header-identity" data-navigation="market"></div>
      <div class="freshness"><span class="status-dot"></span><span id="freshness">Waiting for market data</span></div>
    </header>
    <main class="fleet-page">
      <div class="summary-heading earnings-heading">
        <h1>Market</h1>
        <div class="market-heading-actions">
          <button id="market-watch-add" class="refresh-button" type="button" disabled>Add GPU</button>
          <button id="market-info" class="metric-info" type="button" aria-label="How market comparisons work">i</button>
        </div>
      </div>
      <div id="market-notice" class="notice" role="status">Checking Vast marketplace data…</div>
      <progress id="market-progress" aria-label="Loading market data"></progress>
      <div id="market-groups"></div>
    </main>
    <footer><span>VastStats <span class="version">v1.0.0</span><span class="footer-dot">·</span> USD per GPU-hour</span></footer>
  </div>
  <script type="module" src="navigation.js?v=1.0.0"></script>
  <script type="module" src="market.js?v=1.0.0"></script>
</body>
</html>
