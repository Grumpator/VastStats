<body><div class="shell"><header class="topbar"><div class="header-identity" data-navigation="earnings"></div><div class="freshness"><span class="status-dot"></span><span id="freshness">Waiting for earnings</span></div></header><main class="fleet-page"><div id="notice" class="notice" role="status"></div><div class="summary-heading earnings-heading"><h1>Earnings</h1></div><div class="summary earnings-summary"><div class="recorded-earnings"><span class="metric-label"><span id="recorded-earnings-label">Earned</span> <button class="metric-info" data-earnings-help="earned" aria-label="About recorded earnings" aria-controls="earnings-help">i</button></span><div class="occupancy-values earnings-values"><button id="earned-today-button" class="earned-reading" data-earnings-help="today" aria-label="today earnings breakdown"><strong id="earned-today">—</strong><span class="metric-note">Today</span><span class="earnings-breakdown"><span><span class="compute-label">GPU</span><b id="earned-today-compute">—</b></span><span><span class="bandwidth-label">Bandwidth</span><b id="earned-today-bandwidth">—</b></span><span><span class="storage-label">Storage</span><b id="earned-today-storage">—</b></span></span></button><button id="earned-week-button" class="earned-reading" data-earnings-help="week" aria-label="week earnings breakdown"><strong id="earned-week">—</strong><span class="metric-note">This week</span><span class="earnings-breakdown"><span><span class="compute-label">GPU</span><b id="earned-week-compute">—</b></span><span><span class="bandwidth-label">Bandwidth</span><b id="earned-week-bandwidth">—</b></span><span><span class="storage-label">Storage</span><b id="earned-week-storage">—</b></span></span></button><button id="earned-month-button" class="earned-reading" data-earnings-help="month" aria-label="month earnings breakdown"><strong id="earned-month">—</strong><span class="metric-note">This month</span><span class="earnings-breakdown"><span><span class="compute-label">GPU</span><b id="earned-month-compute">—</b></span><span><span class="bandwidth-label">Bandwidth</span><b id="earned-month-bandwidth">—</b></span><span><span class="storage-label">Storage</span><b id="earned-month-storage">—</b></span></span></button><button id="earned-total-button" class="earned-reading" data-earnings-help="total" aria-label="total earnings breakdown"><strong id="earned-total">—</strong><span class="metric-note">Total</span><span class="earnings-breakdown"><span><span class="compute-label">GPU</span><b id="earned-total-compute">—</b></span><span><span class="bandwidth-label">Bandwidth</span><b id="earned-total-bandwidth">—</b></span><span><span class="storage-label">Storage</span><b id="earned-total-storage">—</b></span></span></button></div></div></div><section class="earnings-chart-panel" aria-labelledby="chart-title"><div class="chart-toolbar"><div class="chart-heading"><h2 id="chart-title">Daily earnings</h2><button id="chart-info" class="metric-info" aria-label="About daily earnings chart">i</button></div><div class="chart-controls"><div class="segments" role="group" aria-label="Earnings chart grouping"><button data-chart-mode="source" aria-pressed="true">By source</button><button data-chart-mode="machine" aria-pressed="false">By machine</button><button data-chart-mode="gpu" aria-pressed="false">By GPU</button></div><label class="chart-range-label"><span class="sr-only">Chart date range</span><select id="chart-range" aria-label="Chart date range"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="year">This year</option><option value="custom">Custom</option></select></label></div></div><div id="chart-custom-range" class="chart-custom-range" hidden><label>From <input id="chart-from" type="date"></label><label>To <input id="chart-to" type="date"></label></div><div class="chart-subhead"><span id="chart-period"></span><span id="chart-status" role="status"></span></div><div id="earnings-chart" class="earnings-chart" aria-label="Daily earnings graph"></div><div class="chart-series-table"><table aria-label="Earnings totals and hourly averages by chart series"><thead><tr><th scope="col">Series</th><th scope="col">Period total</th><th scope="col" id="chart-average-heading">Average $/h</th></tr></thead><tbody id="chart-legend"></tbody></table></div></section></main><footer><span>VastStats <span class="version">v1.3.0</span><span class="footer-dot">·</span> UTC billing days</span></footer></div><script type="module" src="navigation.js?v=1.3.0"></script><script type="module" src="earnings.js?v=1.3.0"></script></body></html>
