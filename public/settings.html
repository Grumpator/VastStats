<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A simple view of rental occupancy across the fleet.">
  <title>VastStats · Settings</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23245840'/%3E%3Cpath d='M8 10l8 14 8-14' fill='none' stroke='%23d4ef8f' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=1.3.0">
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="header-identity" data-navigation="settings"></div><div class="freshness"><span class="status-dot"></span><span id="freshness">Waiting for fleet settings</span></div></header>
    <main class="fleet-page">
      <h1>Settings</h1>
      <section class="settings-panel" aria-labelledby="settings-devices-heading">
        <h2 id="settings-devices-heading">Device suspension</h2>
        <p>Suspended devices are excluded from fleet views and totals by default. Use Show suspended to view them or restore them.</p>
        <label id="settings-token-label" hidden>Settings token <input id="settings-token" type="password" autocomplete="off" spellcheck="false"></label>
        <p id="settings-notice" role="status"></p>
        <ul id="settings-devices" class="settings-devices"></ul>
      </section>
    </main>
    <footer><span>VastStats <span class="version">v1.3.0</span><span class="footer-dot">·</span> Europe/London</span></footer>
  </div>
  <script type="module" src="navigation.js?v=1.3.0"></script>
  <script type="module" src="settings.js?v=1.3.0"></script>
</body>
</html>
